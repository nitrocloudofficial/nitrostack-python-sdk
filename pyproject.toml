[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nitrostack"
version = "0.3.2"
description = "NitroStack Python SDK — A Python-idiomatic port of the NitroStack MCP framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2,<3",
    "pydantic>=2.0.0",
    "starlette>=0.30.0",
    "uvicorn>=0.20.0",
    "watchfiles>=0.18.0",
    "anyio>=4.0.0",
    "packaging>=23.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "tox>=4.0.0",
]

[project.scripts]
nitrostack-py = "nitrostack.cli.main:main"

[tool.setuptools.packages.find]
include = ["nitrostack*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
nitrostack = ["templates/**/*", "templates/**/.*", "cli/templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = []

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["nitrostack"]
omit = [
    "nitrostack/templates/*",
    "nitrostack/cli/templates/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Phase 6 DoD floor; current suite measures ~86%.
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
