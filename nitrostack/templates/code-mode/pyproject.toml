[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nitrostack-code-mode"
version = "0.1.0"
description = "NitroStack code-mode demonstration server"
requires-python = ">=3.10"
dependencies = ["nitrostack", "quickjs>=1.19.4"]

[tool.setuptools]
py-modules = ["main", "app_module"]

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*", "scripts*"]

[tool.setuptools.package-data]
scripts = ["*.js"]
